/* ===== Refined UI: quiet, minimal, light-blue accent ===== */
:root{
  --bg:#f7f9fb;
  --panel:#ffffff;
  --text:#18212f;
  --muted:#7a8492;
  --line:#e7ebef;
  --accent:#4aa3df;
  --accent-soft:#edf7fd;
  --task:#f6f9fb;
  --taskText:#556575;
  --done:#edf8f1;
  --danger:#d45367;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.04);
  --radius:16px;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.app{max-width:980px;margin:0 auto;padding:28px 22px 110px}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-bottom:22px;
  padding:0;
  background:transparent;
  box-shadow:none;
  border:none;
}
.brand h1{
  font-size:22px;
  letter-spacing:-.03em;
  color:#1d2836;
  margin:0;
}
.brand p{font-size:12px;color:var(--muted);margin-top:4px}
.nav{
  display:flex;
  gap:2px;
  background:#eef1f4;
  border-radius:12px;
  padding:3px;
}
.nav button{
  border:0;
  background:transparent;
  color:#687482;
  padding:8px 11px;
  border-radius:9px;
  font-size:12px;
  font-weight:600;
}
.nav button.active{
  background:#fff;
  color:#1f2b38;
  box-shadow:0 1px 3px rgba(16,24,40,.08);
}
.nav button:hover{color:#1f2b38}
.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:0;
  margin-bottom:14px;
  background:transparent;
  border:none;
}
.toolbar .hint{font-size:12px;color:#8a95a2}
.toolbar button,.manage-quick,.add-action{
  border:1px solid #dde3e8!important;
  background:#fff!important;
  color:#3c4856!important;
  box-shadow:none!important;
}
.toolbar button:hover,.manage-quick:hover,.add-action:hover{background:#f8fafb!important}
.genre-list{display:grid;gap:8px}
.genre-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:none;
  padding:15px 16px;
  transition:.15s ease;
}
.genre-card:hover{
  border-color:#d7dee5;
  box-shadow:0 3px 12px rgba(16,24,40,.05);
  transform:none;
}
.genre-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.genre-name{
  font-size:15px;
  font-weight:700;
  color:#263240;
  letter-spacing:-.01em;
}
.updated{
  font-size:10px;
  color:#9aa3ad;
  background:transparent;
  padding:0;
}
.drag{color:#b7bec7;margin-right:8px}
.summary-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 150px;
  gap:8px;
}
.summary-box,.task-count{
  border:0;
  background:#f8fafb;
  border-radius:10px;
  padding:10px 12px;
}
.summary-box .label,.task-count .count-title{
  color:#9aa3ad;
  font-size:10px;
  font-weight:600;
  margin-bottom:4px;
}
.latest-text{font-size:13px;color:#3c4856;line-height:1.45}
.task-count{
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.task-count strong{
  font-size:14px;
  color:#435261;
  margin:0;
  font-weight:700;
}
.tap-add{position:relative;cursor:pointer}
.tap-add:hover{background:#f2f7fa}
.tap-add::after{
  content:"+";
  position:absolute;
  right:10px;top:8px;
  color:#84b9da;
  font-size:13px;
  font-weight:700;
}
.search-wrap{margin-bottom:12px}
.search-wrap input,
.genre-select,.msg,.composer-grid select,.composer-grid textarea,.due-form input{
  border:1px solid #dde4ea;
  background:#fff;
  border-radius:11px;
  padding:11px 12px;
  box-shadow:none;
}
.search-wrap input:focus,.genre-select:focus,.msg:focus,.composer-grid select:focus,.composer-grid textarea:focus,.due-form input:focus{
  outline:none;
  border-color:#9dcce9;
  box-shadow:0 0 0 3px rgba(74,163,223,.10);
}
.inputbar{
  position:fixed;
  left:0;right:0;bottom:0;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(16px);
  border-top:1px solid #e5e9ed;
  box-shadow:0 -4px 16px rgba(16,24,40,.03);
  padding:10px 16px;
}
.input-inner{max-width:980px;margin:0 auto;display:grid;grid-template-columns:110px 1fr auto auto;gap:8px}
.send{
  border:0;
  border-radius:10px;
  padding:0 14px;
  font-size:12px;
  font-weight:700;
}
.memo-btn{background:#edf7fd!important;color:#337fae!important}
.task-btn{background:#4aa3df!important;color:#fff!important}
.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:none;
  padding:16px;
}
.section-title{font-size:15px;color:#263240;letter-spacing:-.01em}
.quick-task-card{
  border:1px solid #e1e7ec;
  background:#fff;
  border-radius:14px;
  box-shadow:none;
  padding:14px 16px;
}
.quick-task-card:hover{box-shadow:0 3px 12px rgba(16,24,40,.05);transform:none}
.quick-task-card strong{font-size:14px;color:#263240}
.quick-task-card span{font-size:11px;color:#8b95a1}
.quick-task-plus{
  width:32px;height:32px;
  background:#edf7fd;
  color:#3f91c5;
  font-size:18px;
}
.task-item{
  border:1px solid #e6eaee;
  background:#fff;
  border-radius:12px;
  box-shadow:none;
  padding:12px 13px;
}
.task-text{font-size:13px;color:#334150}
.pill{
  background:#f3f5f7!important;
  color:#73808d!important;
  border-radius:999px;
  font-size:10px;
}
.small-btn,.record button{
  border:1px solid #e1e6ea!important;
  background:#fff!important;
  color:#687482!important;
  border-radius:9px!important;
}
.small-btn.done,.record button.done{background:#eef8f2!important;color:#41775a!important}
.calendar-wrap{padding:16px}
.calendar-head button{
  border:1px solid #e3e8ec;
  background:#fff!important;
  color:#596776!important;
}
.day{
  border:1px solid #edf0f2!important;
  background:#fff!important;
  min-height:88px;
}
.day.clickable:hover{background:#fafcfd!important;border-color:#dbe3e8!important}
.cal-task{
  background:#eef7fc!important;
  color:#467c9e!important;
  border-radius:6px;
}
.copybar{display:flex;justify-content:flex-end;margin-bottom:10px}
.copybar button,.copy-mini{
  border:1px solid #dde4e9!important;
  background:#fff!important;
  color:#586675!important;
  border-radius:10px!important;
  font-size:11px;
}
.flow-item,.copy-block,.record,.search-hit{
  border:1px solid #e7ebef!important;
  background:#fff!important;
  border-radius:12px!important;
}
.flow-entry{
  background:rgba(255,255,255,.96);
  border:1px solid #e1e7ec;
  border-radius:14px;
  box-shadow:0 6px 20px rgba(16,24,40,.05);
}
.flow-send{background:#4aa3df;border-radius:10px}
.modal{background:rgba(17,24,39,.20);backdrop-filter:blur(6px)}
.sheet{
  border:1px solid #e2e7eb;
  border-radius:18px 18px 0 0;
  box-shadow:0 -12px 40px rgba(16,24,40,.10);
}
.sheet-head h2{font-size:16px;color:#25313f}
.sheet-head button{background:#f4f6f8;color:#66727f}
.deadline-overdue{color:#c9485c!important;font-weight:700}
.deadline-today{color:#9a6a13!important;font-weight:700}
.deadline-soon{color:#438dbb!important;font-weight:700}
@media(max-width:680px){
  .app{padding:16px 12px 110px}
  .topbar{align-items:flex-start;flex-direction:column}
  .nav{width:100%;overflow-x:auto}
  .nav button{flex:0 0 auto}

  padding:7px 11px;
  font-size:11px;
}
.toolbar{
  margin-bottom:10px;
  padding:0 2px;
}
.toolbar .hint{
  font-size:11px;
}
.genre-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.genre-card{
  position:relative;
  border:0;
  background:transparent;
  padding:0;
  box-shadow:none;
}
.genre-card:hover{
  box-shadow:none;
}
.genre-head{
  margin:0 0 5px 8px;
  min-height:18px;
}
.genre-name{
  font-size:12px;
  color:#6d7b88;
  font-weight:700;
}
.updated{
  font-size:9px;
  color:#a1aab3;
}
.summary-row{
  grid-template-columns:minmax(0,1fr) 118px;
  gap:7px;
}
.summary-box{
  position:relative;
  border:0;
  border-radius:18px 18px 18px 6px;
  background:#ffffff;
  box-shadow:0 1px 2px rgba(16,24,40,.06);
  padding:12px 14px;
}
.summary-box .label{
  color:#9aa4ad;
}
.latest-text{
  font-size:13px;
  color:#2e3b48;
  line-height:1.55;
  padding-right:18px;
}
.task-count{
  border:0;
  border-radius:16px 16px 6px 16px;
  background:#eaf6fd;
  box-shadow:0 1px 2px rgba(16,24,40,.04);
  padding:11px 12px;
}
.task-count .count-title{
  color:#77a2bb;
}
.task-count strong{
  font-size:13px;
  color:#2f7097;
}
.tap-add::after{
  content:"＋";
  right:9px;
  top:8px;
  color:#a2b8c6;
  font-size:12px;
}
.search-wrap{
  position:relative;
  margin:0 0 10px;
}
.search-wrap input{
  background:#eef1f4;
  border:0;
  border-radius:12px;
  padding:10px 12px;
  font-size:12px;
}
.search-hit{
  border:0!important;
  background:#fff!important;
  box-shadow:0 1px 2px rgba(16,24,40,.04);
}
.inputbar{
  background:rgba(255,255,255,.97);
  border-top:1px solid #e3e8ec;
  padding:8px 12px 10px;
  box-shadow:0 -6px 20px rgba(16,24,40,.04);
}
.input-inner{
  max-width:860px;
  grid-template-columns:86px minmax(0,1fr) 50px 50px;
  align-items:end;
}
.genre-select{
  height:42px;
  border-radius:12px;
  background:#f1f3f5;
  border:0;
  font-size:11px;
}
.msg{
  min-height:42px;
  max-height:110px;
  border-radius:18px;
  border:1px solid #e0e6eb;
  padding:11px 13px;
  background:#fff;
  font-size:13px;
}
.send{
  height:42px;
  border-radius:14px;
  padding:0 8px;
  font-size:11px;
}
.memo-btn{
  background:#eef7fc!important;
  color:#367da6!important;
}
.task-btn{
  background:#4aa3df!important;
  color:#fff!important;
}
.panel{
  border:0;
  background:#fff;
  border-radius:16px;
  box-shadow:0 1px 2px rgba(16,24,40,.04);
}
.quick-task-card{
  border:0;
  box-shadow:0 1px 2px rgba(16,24,40,.04);
}
.task-item{
  border:0;
  border-bottom:1px solid #eef1f3;
  border-radius:0;
  padding:13px 6px;
}
.task-item:last-child{
  border-bottom:0;
}
.copy-mini{
  border:0!important;
  background:transparent!important;
  color:#5d9bc0!important;
  padding:4px 6px!important;
}
.copy-mini:hover{
  background:#eef7fc!important;
}
.flow-item{
  border:0!important;
  border-bottom:1px solid #eef1f3!important;
  border-radius:0!important;
  padding:12px 2px!important;
}
.flow-item:last-child{
  border-bottom:0!important;
}
.copy-block{
  border:0!important;
  border-bottom:1px solid #eef1f3!important;
  border-radius:0!important;
}
.sheet{
  max-width:720px;
}
@media(max-width:680px){
  .app{padding:10px 10px 112px}
  .topbar{padding-top:4px}
  .brand p{display:none}
  .nav{width:100%;overflow-x:auto;border-radius:12px}
  .summary-row{grid-template-columns:minmax(0,1fr) 102px}
  .input-inner{grid-template-columns:72px minmax(0,1fr) 46px 46px}
  .genre-select{font-size:10px}
  .send{font-size:10px}
}

/* ===== Tab spacing fix ===== */

}

/* Latest memo: compact preview on current-location / reader cards */

#readerView .latest-text{

}

#readerView .summary-box{

.search-advanced{

  grid-template-columns:minmax(220px,1fr) 160px 120px 130px;

}
.search-advanced select{

  background:#fff;

}
.search-results{
  background:#fff;

}

}
.search-hit:last-child{border-bottom:0!important}
.search-hit-kind{

}

}

}

</head>

<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div>
        <h1>Current</h1>
        <p>プロジェクトの「今」を、気軽に残す</p>
      </div>
      <div class="workspace-control">
        <select id="workspaceSelect"></select>
        <button id="addWorkspaceBtn" title="ワークスペース追加">＋</button>
      </div>
    </div>
    <div class="nav">
      <button data-tab="manage" class="active">現在地</button>
      <button data-tab="tasks">タスク</button>
      <button data-tab="calendar">カレンダー</button>
      <button data-tab="reader">まとめて確認</button>
      <button data-tab="all">全体の流れ</button>
    </div>
  </div>

  <section id="manageView" class="tab-view">
    <div class="toolbar"><div class="hint">「最新メモ」「タスク」をタップすると、そのジャンルにすぐ＋できます</div><div style="display:flex;gap:8px"><button id="manageQuickAdd" class="manage-quick">＋ すぐ追加</button><button id="addGenreBtn">＋ ジャンル追加</button></div></div>
    <div class="search-wrap search-advanced">
      <input id="globalSearch" type="search" placeholder="キーワードで検索">
      <select id="searchGenre"><option value="">すべてのジャンル</option></select>
      <select id="searchType">
        <option value="">すべて</option>
        <option value="memo">メモ</option>
        <option value="task">タスク</option>
        <option value="flow">流れ</option>
      </select>
      <select id="searchDue">
        <option value="">期限指定なし</option>
        <option value="overdue">期限超過</option>
        <option value="today">今日</option>
        <option value="tomorrow">明日</option>
        <option value="nodue">期限なし</option>
      </select>
    </div>
    <div id="searchResults" class="search-results hidden"></div>
    <div id="genreList" class="genre-list"></div>
  </section>

  <section id="readerView" class="tab-view hidden">
    <div class="toolbar"><div class="hint">ジャンルごとのメモ・タスク履歴を、編集なしでまとめて確認できます</div></div>
    <div id="readerGenreList" class="genre-list"></div>
  </section>

  <section id="tasksView" class="tab-view hidden">
    <div class="quick-task-card" id="openTaskComposer"><div><strong>タスクを追加</strong><span>思いついたらここからすぐ登録。期限は後でも設定できます</span></div><div class="quick-task-plus">＋</div></div><div class="panel"><div class="toolbar"><div><h2 class="section-title" style="margin-bottom:4px">タスク一覧</h2><div class="subtle">ジャンルを問わず、すべてのタスクを確認できます</div></div></div><div id="allTaskList" class="task-list"></div></div>
  </section>

  <section id="calendarView" class="tab-view hidden">
    <div class="panel calendar-wrap"><div class="subtle" style="margin-bottom:10px">日付をタップすると、その日を期限にしたタスクをすぐ追加できます。</div><div class="calendar-head"><button id="prevMonth">←</button><h2 id="calendarTitle"></h2><button id="nextMonth">→</button></div><div id="calendarGrid" class="calendar-grid"></div></div>
  </section>

  <section id="allView" class="tab-view hidden">
    <div class="copybar"><button id="copyAllStructured">ジャンル別＋全体の流れをコピー</button></div>
    <div class="panel" style="margin-bottom:12px"><h2 class="section-title">全体の流れ</h2><div class="subtle" style="margin-bottom:12px">ここはジャンル管理とは別の、プロジェクト全体の流れだけを残す場所です。</div><div id="integratedFlow" class="flow"></div></div>
    <div class="panel"><h2 class="section-title">ジャンルごとの全記録</h2><div id="allGenreDetails"></div></div>
    <div class="flow-entry"><div class="flow-entry-inner"><select id="flowGenre" class="genre-select"></select><textarea id="flowInput" class="msg" rows="1" placeholder="流れとして残すことを入力"></textarea><button id="flowSend" class="flow-send">追加</button></div></div>
  </section>
</div>

<div class="inputbar" id="inputbar">
  <div class="input-inner">
    <select id="genreSelect" class="genre-select"><option value="">未選択</option></select>
    <textarea id="messageInput" class="msg" rows="1" placeholder="変更点・気づき・やることを入力"></textarea>
    <button class="send memo-btn" id="memoBtn">メモ</button>
    <button class="send task-btn" id="taskBtn">タスク</button>
  </div>
</div>

<div id="detailModal" class="modal"><div class="sheet"><div class="sheet-head"><h2 id="detailTitle"></h2><button id="closeDetail">×</button></div><div id="detailBody"></div></div></div>

<div id="composerModal" class="modal"><div class="sheet small"><div class="sheet-head"><h2 id="composerTitle">すぐ追加</h2><button id="closeComposer">×</button></div><div class="composer-grid"><select id="composerGenre" class="genre-select"></select><textarea id="composerInput" class="msg" rows="2" placeholder="内容を入力"></textarea></div><div id="composerDueWrap" class="due-form hidden"><div class="subtle">期限</div><input type="date" id="composerDue"></div><div class="composer-actions"><button id="composerMemo" class="memo-btn">メモ</button><button id="composerTask" class="task-btn">タスク</button></div></div></div>
<div id="dueModal" class="modal"><div class="sheet small"><div class="sheet-head"><h2>タスクの期限</h2><button id="closeDue">×</button></div><div class="due-form"><div class="subtle">未選択でも送信できます。期限はあとから変更できます。</div><input type="date" id="dueDateInput"><div class="due-actions"><button class="secondary" id="sendNoDue">期限なしで送信</button><button class="primary" id="sendWithDue">送信</button></div></div></div></div>

<script>
const STORAGE_KEY='current_multi_workspace_v1';

const DEMO_STATE={
  genres:[
    {id:'g_receipt',name:'受付',order:0},
    {id:'g_venue',name:'会場',order:1},
    {id:'g_plan',name:'企画',order:2},
    {id:'g_pr',name:'広報',order:3}
  ],
  records:[
    {id:'m1',genreId:'g_receipt',type:'memo',text:'受付は2人体制に変更。QR受付を導入したことで名前確認の工程が不要になり、来場者にはQRコードを読み取ったあとグループ番号だけ案内する。余った1人は会場誘導に回す。開始15分前に来場者が集中した場合のみ、誘導スタッフ1人が受付補助に入る想定。',completed:false,dueDate:null,createdAt:1786590000000,updatedAt:1786590000000},
    {id:'m2',genreId:'g_receipt',type:'memo',text:'カードは受付ではなく会場内で配布する。',completed:false,dueDate:null,createdAt:1786503600000,updatedAt:1786503600000},
    {id:'t1',genreId:'g_receipt',type:'task',text:'QRコードの動作確認',completed:false,dueDate:'2026-08-14',createdAt:1786590300000,updatedAt:1786590300000},
    {id:'t2',genreId:'g_receipt',type:'task',text:'受付導線を大学に確認',completed:true,dueDate:'2026-08-12',createdAt:1786417200000,updatedAt:1786500000000},

    {id:'m3',genreId:'g_venue',type:'memo',text:'机は最大8台まで使用可能。避難経路を確保する必要があるため、中央通路には机を置かない。壁側の小机2台は荷物置き場として使える。',completed:false,dueDate:null,createdAt:1786424400000,updatedAt:1786424400000},
    {id:'t3',genreId:'g_venue',type:'task',text:'当日の配置図を作成',completed:false,dueDate:'2026-08-15',createdAt:1786591500000,updatedAt:1786591500000},

    {id:'m4',genreId:'g_plan',type:'memo',text:'企画は3種類から2種類に変更。共通点探しと価値観カードの内容が似ており、3つ実施すると最後の企画時間が短くなるため。価値観カードと大学生活トークを残し、1企画あたりの時間を長めに取る。',completed:false,dueDate:null,createdAt:1786588200000,updatedAt:1786588200000},
    {id:'t4',genreId:'g_plan',type:'task',text:'各企画の進行台本を作る',completed:false,dueDate:'2026-08-16',createdAt:1786588500000,updatedAt:1786588500000},

    {id:'m5',genreId:'g_pr',type:'memo',text:'申込181人。ポスター経由の申込が増えているため追加のSNS広告は一旦出さず、200人到達までは現状の広報を継続する。',completed:false,dueDate:null,createdAt:1786593000000,updatedAt:1786593000000},
    {id:'t5',genreId:'g_pr',type:'task',text:'申込200人到達状況を確認',completed:false,dueDate:'2026-08-17',createdAt:1786593300000,updatedAt:1786593300000},

    {id:'m6',genreId:null,type:'memo',text:'全体MTGは前日19時からオンラインで実施予定。',completed:false,dueDate:null,createdAt:1786594500000,updatedAt:1786594500000}
  ],
  flowRecords:[
    {id:'f1',genreId:'__all__',text:'受付のQR化によって人員に余裕ができ、会場誘導を増やせるようになった。',createdAt:1786591800000},
    {id:'f2',genreId:'g_plan',text:'企画数を減らして、参加者同士の会話時間を確保する方向に変更。',createdAt:1786592400000}
  ]
};

let appState=loadAppState();
let state=currentWorkspace().data;
let dragId=null;
let activeTab='manage';
let pendingTaskText='';
let pendingTaskGenre=null;
let calDate=new Date(); calDate.setDate(1);

function id(){return Math.random().toString(36).slice(2,10)}
function defaultWorkspaceData(){
  return JSON.parse(JSON.stringify(DEMO_STATE));
}
function loadAppState(){
  const saved=localStorage.getItem(STORAGE_KEY);
  if(saved){
    try{
      const s=JSON.parse(saved);
      if(Array.isArray(s.workspaces)&&s.workspaces.length){
        s.workspaces.forEach(w=>w.data=normalizeState(w.data||{}));
        if(!s.activeWorkspaceId||!s.workspaces.some(w=>w.id===s.activeWorkspaceId))s.activeWorkspaceId=s.workspaces[0].id;
        return s;
      }
    }catch(e){}
  }
  const wid=id();
  return {
    activeWorkspaceId:wid,
    workspaces:[{id:wid,name:'Campus Connect',data:normalizeState(defaultWorkspaceData())}]
  };
}
function currentWorkspace(){
  return appState.workspaces.find(w=>w.id===appState.activeWorkspaceId)||appState.workspaces[0];
}
function normalizeState(s){
  s.genres=s.genres||[]; s.records=s.records||[]; s.flowRecords=s.flowRecords||[]; s.flowRecords.forEach(r=>{if(!('genreId' in r))r.genreId='__all__'});
  s.records.forEach(r=>{if(r.completed===undefined)r.completed=false;if(r.dueDate===undefined)r.dueDate=null;if(!r.updatedAt)r.updatedAt=r.createdAt||Date.now()});
  return s;
}
function save(){currentWorkspace().data=state;localStorage.setItem(STORAGE_KEY,JSON.stringify(appState));render()}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmt(ts){if(!ts)return '—';const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function fmtDate(v){if(!v)return '期限なし';const [y,m,d]=v.split('-');return `${Number(m)}/${Number(d)}`}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dueInfo(r){
  if(r.type!=='task'||!r.dueDate)return {label:'期限なし',cls:''};
  if(r.completed)return {label:'期限 '+fmtDate(r.dueDate),cls:''};
  const t=todayStr(), diff=Math.round((new Date(r.dueDate+'T00:00:00')-new Date(t+'T00:00:00'))/86400000);
  if(diff<0)return {label:`期限超過 ${fmtDate(r.dueDate)}`,cls:'deadline-overdue'};
  if(diff===0)return {label:`今日 ${fmtDate(r.dueDate)}`,cls:'deadline-today'};
  if(diff===1)return {label:`明日 ${fmtDate(r.dueDate)}`,cls:'deadline-soon'};
  return {label:'期限 '+fmtDate(r.dueDate),cls:''};
}
function sortedGenres(){return [...state.genres].sort((a,b)=>a.order-b.order)}
function genreRecords(gid,type=null){return state.records.filter(r=>r.genreId===gid&&(!type||r.type===type)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}
function allRecordsAsc(){return [...state.records].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}
function latestUpdate(gid){const rs=genreRecords(gid);return rs.length?Math.max(...rs.map(r=>r.updatedAt||r.createdAt||0)):null}
function latestMemo(gid){return genreRecords(gid,'memo')[0]||null}
function openTasks(gid){return genreRecords(gid,'task').filter(r=>!r.completed)}
function completedTasks(gid){return genreRecords(gid,'task').filter(r=>r.completed)}
function genreName(gid){if(!gid)return 'ジャンル未選択';return state.genres.find(g=>g.id===gid)?.name||'削除済みジャンル'}


function renderWorkspaceSelect(){
  const s=document.getElementById('workspaceSelect'); if(!s)return;
  s.innerHTML=appState.workspaces.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('');
  s.value=appState.activeWorkspaceId;
}
function switchWorkspace(id){
  if(!appState.workspaces.some(w=>w.id===id))return;
  currentWorkspace().data=state;
  appState.activeWorkspaceId=id;
  state=currentWorkspace().data;

function modifyRecord(rid,action){const r=state.records.find(x=>x.id===rid);if(!r)return;if(action==='toggle'){r.completed=!r.completed;r.updatedAt=Date.now() }else if(action==='genre'){

}else if(action==='edit'){const v=prompt('内容を編集',r.text);if(v!==null&&v.trim()){r.text=v.trim();r.updatedAt=Date.now()}else return}else if(action==='due'){const v=prompt('期限を入力してください（YYYY-MM-DD）\n空欄で期限なし',r.dueDate||'');if(v===null)return;if(v.trim()&&!/^\d{4}-\d{2}-\d{2}$/.test(v.trim())){alert('YYYY-MM-DD 形式で入力してください');return}r.dueDate=v.trim()||null;r.updatedAt=Date.now()}else if(action==='delete'){if(!confirm('この記録を削除しますか？'))return;state.records=state.records.filter(x=>x.id!==rid)}save()}

function renderSearch(){
  const input=document.getElementById('globalSearch'),root=document.getElementById('searchResults');
  const genreSel=document.getElementById('searchGenre'),typeSel=document.getElementById('searchType'),dueSel=document.getElementById('searchDue');
  if(!input||!root)return;
  renderSearchGenre();
  const q=(input.value||'').trim().toLowerCase();
  const genre=genreSel?.value||'', type=typeSel?.value||'', due=dueSel?.value||'';
  if(!q&&!genre&&!type&&!due){root.classList.add('hidden');root.innerHTML='';return}
  const t=todayStr();
  const tomorrow=(()=>{const d=new Date(t+'T00:00:00');d.setDate(d.getDate()+1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`})();
  let hits=[];
  state.records.forEach(r=>{
    if(q && !(r.text||'').toLowerCase().includes(q))return;
    if(genre){
      if(genre==='__ungrouped'){if(r.genreId!==null)return}
      else if(r.genreId!==genre)return;
    }
    if(type && r.type!==type)return;
    if(due){
      if(r.type!=='task')return;
      if(due==='overdue' && !(r.dueDate && !r.completed && r.dueDate<t))return;
      if(due==='today' && r.dueDate!==t)return;
      if(due==='tomorrow' && r.dueDate!==tomorrow)return;
      if(due==='nodue' && r.dueDate)return;
    }
    hits.push({kind:r.type==='task'?'タスク':'メモ',genre:genreName(r.genreId),text:r.text,time:r.updatedAt||r.createdAt,completed:r.completed,dueDate:r.dueDate});
  });
  state.flowRecords.forEach(r=>{
    if(type && type!=='flow')return;
    if(due)return;
    if(q && !(r.text||'').toLowerCase().includes(q))return;
    if(genre){
      const gid=r.genreId==='__all__'?null:r.genreId;
      if(genre==='__ungrouped'){if(gid!==null)return}
      else if(gid!==genre)return;
    }
    hits.push({kind:'流れ',genre:r.genreId==='__all__'?'全体':genreName(r.genreId),text:r.text,time:r.createdAt});
  });
  hits.sort((a,b)=>a.time-b.time);
  root.classList.remove('hidden');
  root.innerHTML=hits.length?hits.map(h=>`<div class="search-hit"><div class="search-hit-top"><div><span class="search-hit-kind">${h.kind}</span><span>${esc(h.genre)}</span></div><span>${fmt(h.time)}</span></div><div class="search-hit-text">${esc(h.text)}</div>${h.kind==='タスク'?`<div class="due-row">${h.completed?'完了':'未完了'} ・ ${h.dueDate?'期限 '+fmtDate(h.dueDate):'期限なし'}</div>`:''}</div>`).join(''):'<div class="empty">条件に合う記録はありません</div>';
}

function buildFilteredCopy(mode='all',gid=undefined){
  const cutoff=Date.now()-7*86400000;
  const genres=gid!==undefined?[{id:gid,name:genreName(gid)}]:[...sortedGenres().map(g=>({id:g.id,name:g.name})),{id:null,name:'ジャンル未選択'}];
  let out='';
  genres.forEach(g=>{
    let memos=genreRecords(g.id,'memo'),tasks=genreRecords(g.id,'task');
    if(mode==='open'){memos=[];tasks=tasks.filter(r=>!r.completed)}
    if(mode==='7d'){memos=memos.filter(r=>(r.updatedAt||r.createdAt)>=cutoff);tasks=tasks.filter(r=>(r.updatedAt||r.createdAt)>=cutoff)}
    if(!memos.length&&!tasks.length)return;
    out+=`【${g.name}】\n`;
    if(mode!=='open')out+=`メモ\n${memos.length?memos.map(r=>`・${r.text}（${fmt(r.updatedAt||r.createdAt)}）`).join('\n'):'なし'}\n`;
    out+=`タスク\n${tasks.length?tasks.map(r=>`・${r.completed?'[完了]':'[未完了]'} ${r.text}${r.dueDate?' / '+dueInfo(r).label:''}（${fmt(r.updatedAt||r.createdAt)}）`).join('\n'):'なし'}\n\n`;
  });
  return out.trim()||'該当する記録はありません';
}
function reorder(a,b){if(!a||a===b)return;const gs=sortedGenres(),ai=gs.findIndex(g=>g.id===a),bi=gs.findIndex(g=>g.id===b);if(ai<0||bi<0)return;const [m]=gs.splice(ai,1);gs.splice(bi,0,m);gs.forEach((g,i)=>{const x=state.genres.find(v=>v.id===g.id);if(x)x.order=i});save()}

function renameGenre(gid){const g=state.genres.find(x=>x.id===gid);const n=prompt('ジャンル名',g.name);if(n&&n.trim()){g.name=n.trim();save();openDetail(gid,true)}}
function deleteGenre(gid){if(!confirm('ジャンルを削除しますか？\n記録は「ジャンル未選択」に移動します。'))return;state.records.forEach(r=>{if(r.genreId===gid)r.genreId=null});state.genres=state.genres.filter(g=>g.id!==gid);detailModal.classList.remove('open');save()}
function buildCopyText(){let out='【ジャンルごとの記録】\n\n';[...sortedGenres().map(g=>({id:g.id,name:g.name})),{id:null,name:'ジャンル未選択'}].forEach(g=>{const memos=genreRecords(g.id,'memo'),tasks=genreRecords(g.id,'task');out+=`【${g.name}】\nメモ\n${memos.length?memos.map(r=>`・${r.text}（${fmt(r.updatedAt||r.createdAt)}）`).join('\n'):'なし'}\nタスク\n${tasks.length?tasks.map(r=>`・${r.completed?'[完了]':'[未完了]'} ${r.text}${r.dueDate?' / 期限 '+fmtDate(r.dueDate):''}（${fmt(r.updatedAt||r.createdAt)}）`).join('\n'):'なし'}\n\n`});out+='【全体の流れ】\n';out+=([...state.flowRecords].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).map(r=>`${fmt(r.createdAt)}｜${r.genreId==='__all__'||!r.genreId?'全体':genreName(r.genreId)}｜${r.text}`).join('\n')||'記録なし');return out.trim()}
function copyStructured(){const text=buildCopyText();navigator.clipboard.writeText(text).then(()=>alert('全体をコピーしました')).catch(()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('全体をコピーしました')})}

function switchTab(name,update=true){activeTab=name;document.querySelectorAll('.tab-view').forEach(v=>v.classList.add('hidden'));document.getElementById(name+'View').classList.remove('hidden');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));inputbar.classList.toggle('hidden',name==='all'||name==='reader'||name==='tasks'||name==='calendar');if(update)window.scrollTo({top:0,behavior:'smooth'})}

memoBtn.onclick=addMemo;taskBtn.onclick=beginTask;addGenreBtn.onclick=addGenre;manageQuickAdd.onclick=()=>openComposer('both');openTaskComposer.onclick=()=>openComposer('task');closeComposer.onclick=()=>composerModal.classList.remove('open');composerModal.addEventListener('click',e=>{if(e.target===composerModal)composerModal.classList.remove('open')});composerMemo.onclick=composerAddMemo;composerTask.onclick=composerAddTask;closeDetail.onclick=()=>detailModal.classList.remove('open');detailModal.addEventListener('click',e=>{if(e.target===detailModal)detailModal.classList.remove('open')});closeDue.onclick=()=>dueModal.classList.remove('open');dueModal.addEventListener('click',e=>{if(e.target===dueModal)dueModal.classList.remove('open')});sendNoDue.onclick=()=>finishTask(null);sendWithDue.onclick=()=>finishTask(dueDateInput.value||null);copyAllStructured.onclick=copyStructured;flowSend.onclick=addFlowRecord;flowInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();addFlowRecord()}});prevMonth.onclick=()=>{calDate.setMonth(calDate.getMonth()-1);renderCalendar()};nextMonth.onclick=()=>{calDate.setMonth(calDate.getMonth()+1);renderCalendar()};document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
globalSearch.addEventListener('input',renderSearch);
searchGenre.addEventListener('change',renderSearch);
searchType.addEventListener('change',renderSearch);
searchDue.addEventListener('change',renderSearch);
document.getElementById('workspaceSelect').addEventListener('change',e=>switchWorkspace(e.target.value));
document.getElementById('addWorkspaceBtn').addEventListener('click',addWorkspace);
messageInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();addMemo()}});
render();
</script>
</body>
